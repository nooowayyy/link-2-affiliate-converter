<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Ofertas - Robô Afiliados</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-10 text-center md:text-left">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">🤖 Hub de Automação de Afiliados</h1>
            <p class="text-gray-400 mt-2">Envie promoções formatadas e comissionadas direto para o WhatsApp</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Coluna 1 e 2: Formulário de Ofertas -->
            <div class="md:col-span-2 bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
                <h2 class="text-xl font-bold mb-6 text-purple-400 border-b border-gray-700 pb-2">📦 Novo Post de Oferta</h2>
                
                <form id="offerForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-300">ID do Grupo/Canal do WhatsApp</label>
                            <input type="text" id="chatId" placeholder="ex: 1203631948@g.us" class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:border-purple-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-300">Seu ID de Afiliado (SubID/Tag)</label>
                            <input type="text" id="affiliateId" placeholder="ex: emipeafiliado" class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:border-purple-500" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-300">Título do Produto</label>
                        <input type="text" id="title" placeholder="ex: Monitor Arzopa Gamer 27 QHD Fast IPS" class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:border-purple-500" required>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-300">Link Original do Produto (Sem comissão)</label>
                        <input type="url" id="originalUrl" placeholder="https://shopee.com.br/..." class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:border-purple-500" required>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-300">Preço (R$)</label>
                            <input type="text" id="price" placeholder="852" class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:border-purple-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-300">Parcelamento</label>
                            <input type="text" id="installments" placeholder="6x sem juros" class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-300">Cupom (Opcional)</label>
                            <input type="text" id="coupon" placeholder="LIPE115" class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:border-purple-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-300">URL da Imagem do Produto</label>
                            <input type="url" id="imageUrl" placeholder="https://..." class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-300">Marketplace</label>
                            <select id="marketplace" class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:border-purple-500">
                                <option value="shopee">Shopee</option>
                                <option value="amazon">Amazon</option>
                                <option value="mercadolivre">Mercado Livre</option>
                                <option value="magalu">Magazine Luiza</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="w-full p-3 bg-gradient-to-r from-purple-500 to-pink-600 rounded-lg font-bold hover:from-purple-600 hover:to-pink-700 transition duration-200">🚀 Publicar Oferta no WhatsApp</button>
                </form>
            </div>

            <!-- Coluna 3: WhatsApp Status / QR Code -->
            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700 flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold mb-4 text-pink-500 border-b border-gray-700 pb-2">📲 Conexão WhatsApp</h2>
                    <div class="flex items-center justify-between mb-4">
                        <span>Status:</span>
                        <span id="wpStatus" class="px-3 py-1 bg-red-900 text-red-300 text-xs font-bold rounded-full">DESCONECTADO</span>
                    </div>

                    <!-- Área do QR Code / Loading -->
                    <div id="qrContainer" class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex flex-col items-center justify-center min-h-[250px] text-center">
                        <p class="text-gray-500 text-sm">Clique no botão abaixo para ativar a leitura do QR Code.</p>
                    </div>
                </div>

                <button id="btnConnect" class="w-full mt-4 p-3 bg-gray-700 hover:bg-gray-600 rounded-lg font-semibold transition duration-200">Ligar Dispositivo</button>
            </div>
        </div>
    </div>

    <script>
        const btnConnect = document.getElementById('btnConnect');
        const wpStatus = document.getElementById('wpStatus');
        const qrContainer = document.getElementById('qrContainer');
        const offerForm = document.getElementById('offerForm');

        // Monitorar Status do WhatsApp
        async function checkStatus() {
            try {
                const res = await fetch('/api/whatsapp/status');
                const data = await res.json();
                wpStatus.innerText = data.status;

                if (data.status === 'DESCONECTADO') {
                    wpStatus.className = "px-3 py-1 bg-red-900 text-red-300 text-xs font-bold rounded-full";
                    qrContainer.innerHTML = '<p class="text-gray-500 text-sm">Clique no botão abaixo para ativar.</p>';
                } else if (data.status === 'AGUARDANDO_QR') {
                    wpStatus.className = "px-3 py-1 bg-yellow-900 text-yellow-300 text-xs font-bold rounded-full";
                    // Simplificação: mostra o código de pareamento do terminal na tela de forma amigável
                    qrContainer.innerHTML = `<div class="p-2 bg-white rounded-lg text-black text-xs font-mono break-all">${data.qrCode}</div><p class="text-xs text-gray-400 mt-2">Escaneie o QR Code exibido no terminal do servidor</p>`;
                } else if (data.status === 'CONECTADO') {
                    wpStatus.className = "px-3 py-1 bg-green-900 text-green-300 text-xs font-bold rounded-full";
                    qrContainer.innerHTML = '✅ <span class="text-green-400 font-bold block mt-2">WhatsApp Vinculado!</span><p class="text-xs text-gray-400">Pronto para disparar links de afiliados.</p>';
                } else {
                    wpStatus.className = "px-3 py-1 bg-blue-900 text-blue-300 text-xs font-bold rounded-full";
                    qrContainer.innerHTML = '<p class="text-gray-400">Iniciando serviços...</p>';
                }
            } catch(e) {}
        }

        btnConnect.addEventListener('click', async () => {
            qrContainer.innerHTML = '<p class="text-gray-400 animate-pulse">Iniciando o WhatsApp Web de fundo...</p>';
            await fetch('/api/whatsapp/connect', { method: 'POST' });
        });

        // Enviar Oferta
        offerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                chatId: document.getElementById('chatId').value,
                affiliateId: document.getElementById('affiliateId').value,
                title: document.getElementById('title').value,
                originalUrl: document.getElementById('originalUrl').value,
                price: document.getElementById('price').value,
                installments: document.getElementById('installments').value,
                coupon: document.getElementById('coupon').value,
                imageUrl: document.getElementById('imageUrl').value,
                marketplace: document.getElementById('marketplace').value
            };

            try {
                const res = await fetch('/api/affiliate/send-offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    alert('Oferta postada com sucesso!');
                } else {
                    alert('Erro: ' + data.error);
                }
            } catch (err) {
                alert('Erro ao conectar ao servidor.');
            }
        });

        setInterval(checkStatus, 3000);
    </script>
</body>
</html>
